version: 2.1

orbs:
  node: circleci/node@5.2.0

# Installe uv (gestionnaire de paquets/venv) et l'expose au PATH des steps suivants.
commands:
  install-uv:
    steps:
      - run:
          name: Installer uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

jobs:
  block-merge-rules:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Block Dev to Main
          command: |
            PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | grep -o '[0-9]*$')

            echo "PR Number: $PR_NUMBER"

            if [ -z "$PR_NUMBER" ]; then
              echo "Pas de PR détectée, skip"
              exit 0
            fi

            PR_DATA=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open")

            SOURCE_BRANCH=$(echo "$PR_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['head']['ref']) if d else print('')")
            TARGET_BRANCH=$(echo "$PR_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['base']['ref']) if d else print('')")

            echo "Source branch: $SOURCE_BRANCH"
            echo "Target branch: $TARGET_BRANCH"

            # Règles vers main : seulement release/* et hotfix/*
            if [ "$TARGET_BRANCH" = "main" ]; then
              if ! echo "$SOURCE_BRANCH" | grep -qE '^(release|hotfix)/'; then
                echo "Seules les branches release/* et hotfix/* peuvent etre merge dans main !"
                exit 1
              fi
            fi

            # Règles vers integration : seulement develop et hotfix/*
            if [ "$TARGET_BRANCH" = "integration" ]; then
              if [ "$SOURCE_BRANCH" != "develop" ] && ! echo "$SOURCE_BRANCH" | grep -qE '^hotfix/'; then
                echo "Seules develop et hotfix/* peuvent etre merge dans integration !"
                exit 1
              fi
            fi

            echo "OK"

  scan-secrets:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run:
          name: gitleaks
          command: |
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
              | tar -xz gitleaks
            ./gitleaks detect --source . --no-banner --redact --verbose

  # Lint + import-sorting (Ruff). Autonome : pas besoin d'installer les dépendances
  # du projet, `uvx` récupère Ruff à la volée. Config dans Tom/pyproject.toml.
  lint:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - install-uv
      - run:
          name: Ruff (lint)
          command: uvx ruff check .

  # Tests de la partie IA (Tom/) : contrat d'API, unitaires, dictionnaire de données.
  # Dépendances reproduites depuis le lockfile (uv.lock) — variante torch CPU via
  # l'extra `cpu`. Les modèles d'inférence sont committés (models/*.pt, scaler.joblib),
  # donc les tests marqués @needs_models s'exécutent réellement ici.
  test-ia:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - install-uv
      - restore_cache:
          keys:
            - uv-cpu-v1-{{ checksum "uv.lock" }}
      - run:
          name: Installer les dépendances (torch CPU, depuis le lockfile)
          command: uv sync --frozen --extra cpu
      - save_cache:
          key: uv-cpu-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Lancer les tests (avec couverture)
          command: uv run --frozen pytest -q --cov=ml --cov=backend --cov-report=xml
      # Le rapport de couverture est transmis au job `sonarcloud` via le workspace.
      - persist_to_workspace:
          root: ~/project
          paths:
            - Tom/coverage.xml

  # Gate qualité modèle (MLOps) : refuse un modèle dont les performances régressent
  # sous le contrat (ml/metrics_thresholds.json). Lit le rapport committé
  # models/metrics.json. Aucune dépendance (stdlib), aucune donnée : rapide et déterministe.
  validate-model:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Gate de validation des métriques
          command: python -m ml.validate_metrics

  # Scan des vulnérabilités connues des dépendances (pip-audit), en complément de
  # gitleaks (secrets). On audite l'environnement installé (torch, absent de PyPI,
  # est ignoré proprement). NON BLOQUANT au départ : une CVE transitive non
  # corrigeable ne doit pas casser la CI — à durcir une fois le socle assaini.
  deps-audit:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - install-uv
      - run:
          name: Installer l'environnement (sans torch, non audité)
          command: uv sync --frozen --extra cpu --no-install-package torch
      - run:
          name: pip-audit (non bloquant)
          command: uv run --with pip-audit pip-audit || echo "Vulnérabilités détectées (non bloquant pour l'instant)."

  # Valide que les images se construisent (conteneurisation, CDC §8.1).
  build-images:
    machine:
      image: ubuntu-2404:current
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Build des images backend & frontend
          command: docker compose build

  # Test end-to-end : démarre l'API dans son conteneur (modèles embarqués) et vérifie
  # une prédiction bout-en-bout par HTTP. tests/test_e2e.py ne dépend que de `requests`.
  e2e:
    machine:
      image: ubuntu-2404:current
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - install-uv
      - run:
          name: Démarrer l'API conteneurisée
          command: docker compose up -d --build backend
      - run:
          name: Attendre le healthcheck de l'API
          command: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health >/dev/null; then echo "API up"; exit 0; fi
              sleep 2
            done
            echo "API indisponible :"; docker compose logs backend; exit 1
      - run:
          name: Lancer les tests E2E
          command: |
            MECHA_E2E_URL=http://localhost:8000 \
              uvx --with requests --with pytest pytest tests/test_e2e.py -v

  # Analyse qualité SonarCloud (bugs, code smells, duplication, maintenabilité) +
  # couverture (coverage.xml produit par test-ia, récupéré via le workspace).
  # Config : Tom/sonar-project.properties. Requiert la variable SONAR_TOKEN (SonarCloud).
  # Garde : si le token n'est pas encore configuré, le job s'ignore sans casser la CI.
  sonarcloud:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/Tom
    steps:
      - checkout:
          path: ~/project
      - attach_workspace:
          at: ~/project
      - run:
          name: Analyse SonarCloud
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN non défini : configure le projet SonarCloud et ajoute le"
              echo "token dans les variables CircleCI. Job ignoré (non bloquant)."
              exit 0
            fi
            SCANNER=sonar-scanner-cli-7.0.2.4839-linux-x64
            curl -sSLo /tmp/scanner.zip \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SCANNER}.zip"
            unzip -q /tmp/scanner.zip -d /tmp
            "/tmp/${SCANNER}/bin/sonar-scanner"

workflows:
  ci:
    jobs:
      - block-merge-rules
      - scan-secrets
      - lint
      - deps-audit
      - test-ia
      - validate-model
      - build-images:
          requires:
            - test-ia
      - e2e:
          requires:
            - build-images
      # Analyse qualité en fin de chaîne : a besoin de la couverture (test-ia) et
      # attend la validation E2E pour ne s'exécuter qu'une fois le reste au vert.
      - sonarcloud:
          requires:
            - test-ia
            - e2e

  # Livraison continue : au push d'un tag vX.Y.Z, on (re)build les images de release.
  # Build-only (pas de push registry) → aucun credential requis. Le push vers un
  # registre / déploiement VPS (deploy.sh) reste une évolution documentée.
  cd:
    jobs:
      - build-images:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
