global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
# Métriques par conteneur (CPU/RAM de backend, frontend, traefik...)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Métriques de l'hôte (CPU/RAM/disque/réseau du VPS)
  - job_name: node
    static_configs:
    - targets: ["node-exporter:9100"]

  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
    - targets: ["localhost:9090"]

# (Optionnel) métriques applicatives du backend FastAPI.
# À activer seulement si tu ajoutes prometheus-fastapi-instrumentator
# (expose /metrics) dans le backend :
# - job_name: backend
#   metrics_path: /metrics
#   static_configs:
#     - targets: ["backend:8000"]
