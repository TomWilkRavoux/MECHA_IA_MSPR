# Configuration SonarCloud — MECHA (partie IA).
# Le scanner tourne depuis la racine (job `sonarcloud` de .circleci/config.yml).
#
# Prérequis côté CircleCI : définir la variable d'environnement SONAR_TOKEN
# (Project Settings > Environment Variables), jeton généré sur https://sonarcloud.io.
#
# projectKey / organization : valeurs par défaut = convention d'import GitHub de
# SonarCloud (<orga>_<repo>). À confirmer dans les paramètres du projet SonarCloud.
sonar.host.url=https://sonarcloud.io
sonar.projectKey=TomWilkRavoux_MECHA_IA_MSPR
sonar.organization=workshopepsi
sonar.projectName=MECHA - Partie IA

sonar.python.version=3.12

# Code applicatif analysé (chemins relatifs à la racine)
sonar.sources=backend,ml,frontend,sim
sonar.tests=tests

# Couverture produite par le job test-ia (pytest-cov -> coverage.xml, transmis via workspace)
sonar.python.coverage.reportPaths=coverage.xml

# Hors analyse : notebooks d'exploration, données, artefacts binaires
sonar.exclusions=**/__marimo__/**,notebooks/**,preAnalyse/**,assets/**,**/*.ipynb
# La couverture n'est mesurée que sur le cœur IA (ml/, backend/) exécuté par les tests.
# ml/train.py est le pipeline d'entraînement (torch + dataset C-MAPSS complet) : validé
# manuellement / via le job e2e, pas par des tests unitaires — donc hors mesure de couverture.
sonar.coverage.exclusions=tests/**,frontend/**,sim/**,**/__init__.py,ml/train.py
